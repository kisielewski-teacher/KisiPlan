name: Build APK & IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build APK
        run: flutter build apk --debug
        working-directory: flutter_app

      - name: Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk Kisiplan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kisiplan-apk
          path: Kisiplan.apk

  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: flutter_app/ios

      - name: Build iOS app (no codesign)
        run: flutter build ios --no-codesign --release
        working-directory: flutter_app

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r flutter_app/build/ios/iphoneos/Runner.app Payload/
          zip -r Kisiplan.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kisiplan-ipa
          path: Kisiplan.ipa

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Only runs when a version tag (vX.Y.Z) is pushed. The in-app update
    # checker (lib/services/update_service.dart) polls the "latest" release
    # of this repo and expects a .apk asset attached to it.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Determine version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # Unix timestamp: always increases over time, so it never collides
          # with (or falls behind) an ad-hoc local build's --build-number,
          # unlike github.run_number which is unrelated to build recency and
          # caused INSTALL_FAILED_VERSION_DOWNGRADE when a local test build
          # was installed after a CI release with a higher run_number.
          echo "build_number=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build_number }}
        working-directory: flutter_app

      - name: Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk PlanMechanika.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: PlanMechanika.apk
          generate_release_notes: true
