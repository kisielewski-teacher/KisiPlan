name: kisiplan
description: Aplikacja planu lekcji dla uczniów i nauczycieli
publish_to: 'none'
version: 1.3.1+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  intl: ^0.20.2
  html: ^0.15.4
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  home_widget: ^0.9.4
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icona.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/Mechanik.png
    - assets/icona.png
